# NUR FELDREFERENZ — NICHT ANWENDEN.
#
# Diese Datei zeigt, welche Schluessel das Secret `msm-secrets` enthalten muss.
# Sie enthaelt bewusst keine verwendbaren Werte und darf nie mit echten Werten
# in ein Repository gelangen.
#
# Anlegen stattdessen ueber einen Secret-Manager (External Secrets Operator,
# Vault, SOPS) oder direkt:
#
#   kubectl -n msm create secret generic msm-secrets \
#     --from-literal=MSM_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=MSM_DIS_SIDECAR_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=MSM_DIS_SALT="$(openssl rand -hex 16)" \
#     --from-literal=MSM_DATABASE_URL='postgresql+psycopg2://msm:PASSWORT@msm-postgres:5432/msm' \
#     --from-literal=MSM_DATABASE_URL_ASYNC='postgresql+asyncpg://msm:PASSWORT@msm-postgres:5432/msm' \
#     --from-literal=POSTGRES_PASSWORD='PASSWORT'
#
apiVersion: v1
kind: Secret
metadata:
  name: msm-secrets
  namespace: msm
type: Opaque
stringData:
  # Peppert E-Mail-Hashes und signiert Reset-Token. Eine Rotation macht damit
  # verschluesselte Bestandsdaten unlesbar — siehe README.
  MSM_SECRET_KEY: "REPLACE_ME"
  # Bearer-Token zwischen Panel und DIS-Sidecar innerhalb des Pods.
  MSM_DIS_SIDECAR_TOKEN: "REPLACE_ME"
  MSM_DIS_SALT: "REPLACE_ME"
  MSM_DATABASE_URL: "REPLACE_ME"
  MSM_DATABASE_URL_ASYNC: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
