apiVersion: v1
kind: ServiceAccount
metadata:
  name: msm-panel
  namespace: msm
# Das Panel spricht nie mit der Kubernetes-API. Deshalb kein RBAC-Binding und
# kein projizierter Token — ein kompromittiertes Panel bekommt so keinen
# Cluster-Zugriff geschenkt.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: msm-panel
  namespace: msm
  labels:
    app.kubernetes.io/name: msm
    app.kubernetes.io/component: panel
spec:
  # Genau eine Instanz. Das Panel haelt prozesslokalen Zustand (Scheduler-Jobs,
  # Lifecycle-Sperren, Settings-Cache); zwei Instanzen wuerden Serveraktionen
  # doppelt ausfuehren. Kapazitaet waechst ueber weitere MSM-Nodes, nicht ueber
  # weitere Panel-Replicas. Ausfuehrliche Begruendung im README.
  replicas: 1
  strategy:
    # Recreate statt RollingUpdate: waehrend eines Rollouts duerfen nie zwei
    # Panels gleichzeitig laufen. Kurze Downtime ist der bewusst gewaehlte Preis.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: msm
      app.kubernetes.io/component: panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: msm
        app.kubernetes.io/component: panel
    spec:
      serviceAccountName: msm-panel
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ── DIS-Sidecar ────────────────────────────────────────────────────
        # Muss im selben Pod laufen: der Sidecar bindet ausschliesslich an
        # 127.0.0.1. Dadurch ist die Krypto-Schnittstelle fuer andere Pods
        # nicht erreichbar — ein Service dafuer waere ein Sicherheitsrueckschritt.
        - name: dis-sidecar
          image: ghcr.io/mauntingstudios/msm-dis-sidecar:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: "production"
            - name: MSM_DIS_SIDECAR_PORT
              value: "9100"
            - name: MSM_DIS_SIDECAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DIS_SIDECAR_TOKEN
            - name: MSM_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_SECRET_KEY
            - name: MSM_DIS_SALT
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DIS_SALT
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 20

        # ── Panel (API + ausgeliefertes Frontend) ──────────────────────────
        - name: panel
          image: ghcr.io/mauntingstudios/msm-panel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: msm-config
          env:
            - name: MSM_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_SECRET_KEY
            - name: MSM_DIS_SIDECAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DIS_SIDECAR_TOKEN
            - name: MSM_DIS_SALT
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DIS_SALT
            - name: MSM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DATABASE_URL
            - name: MSM_DATABASE_URL_ASYNC
              valueFrom:
                secretKeyRef:
                  name: msm-secrets
                  key: MSM_DATABASE_URL_ASYNC
          securityContext:
            allowPrivilegeEscalation: false
            # Nicht read-only: das Panel schreibt Konfiguration, Blueprints und
            # Panel-Backups unter /opt/msm. Die schreibbaren Pfade sind auf das
            # persistente Volume begrenzt.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: panel-data
              mountPath: /opt/msm
            - name: tmp
              mountPath: /tmp
          # Startup-Probe deckt Migrationen und die Startup-Reconciliation ab.
          # Bis zu 5 Minuten, damit ein groesserer Migrationslauf den Pod nicht
          # in eine Neustartschleife schickt.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: panel-data
          persistentVolumeClaim:
            claimName: msm-panel-data
        - name: tmp
          emptyDir: {}
      # Laufende Lifecycle-Threads sollen sich sauber beenden koennen.
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: msm-panel-data
  namespace: msm
spec:
  accessModes:
    # ReadWriteOnce genuegt und passt zu `replicas: 1`.
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: msm-panel
  namespace: msm
spec:
  selector:
    app.kubernetes.io/name: msm
    app.kubernetes.io/component: panel
  ports:
    - name: http
      port: 80
      targetPort: http
