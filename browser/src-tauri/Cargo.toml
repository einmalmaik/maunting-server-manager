[package]
name = "maunting-secure-browser"
version = "5.3.2"
description = "MSB - Maunting Secure Browser auf Tauri v2"
edition = "2021"
rust-version = "1.88"

[lib]
name = "maunting_secure_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
schluesselfach = { path = "../../crates/schluesselfach" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Favicons (Windows) und Standbilder (Android) reisen als Base64; schon im Baum, über Tauri.
base64 = "0.22"
# Werbe- und Trackerfilter von Brave (MPL-2.0), dieselbe Engine wie in Brave.
# Ohne `single-thread`: die Engine liegt hinter einem RwLock und wird aus dem
# UI-Thread (WebView2) und aus dem Ladefaden der Listen angefasst.
adblock = { version = "0.13", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }
# Filterlisten holen. rustls statt OpenSSL, damit Windows und Android gleich bauen.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Gleiche Site für Download-Cookies unter Android (`downloads::gleiche_site`).
# Die Public-Suffix-Liste liegt über adblock schon im Baum.
psl = "2"
# Symbole der Kacheln (`kachelsymbol.rs`): Bilder aus dem Netz dekodiert Rust,
# nicht die Oberfläche. Schon im Baum über Tauri (`image-png`); `ico` ist ein
# Dekoder im selben Paket, kein neues.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4"
# Updates unter Windows (`aktualisieren.rs`), dasselbe Plugin wie im Smart System.
tauri-plugin-updater = "2"
# Ein Link von außen öffnet als Tab im laufenden Browser, nicht als zweites
# Fenster, das um dasselbe WebView2-Profil streitet (`widget/ohne.rs`).
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Dieselben Versionen, die wry mitbringt: die Schnittstellen der WebView2
# (Anfragen filtern, Adresse, Verlauf, Favicon) gibt Tauri nicht selbst heraus.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # Name und Symbol im Lautstärkemixer (`mixer.rs`).
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    # Ist der Browser der Standardbrowser? Nur lesend (`widget/ohne/windows_standard.rs`).
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    # Freier Platz für die Download-Reserve (`downloads/quarantaene.rs`).
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    # IAttachmentExecute: Downloads durch den Virenschutz von Windows prüfen.
    "Win32_UI_Shell",
    # SHOpenFolderAndSelectItems: einen Download im Explorer zeigen.
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
# Erweiterungen aus dem Web Store (`erweiterungen/`): ring prüft die
# Signaturen des CRX3-Pakets, zip entpackt es. Beide liegen über rustls und
# den Updater schon im Baum.
ring = "0.17"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-biometric = "2"
# JNI für die Tab-WebViews (`tabs/android/bruecke.rs`), dieselbe Fassung wie
# die Kamera-Krypto des Smart Systems.
jni = "0.21"
# reqwest prüft Zertifikate per rustls-platform-verifier; unter Android braucht
# der eine Initialisierung samt Kotlin-Teil und wirft ohne sie bei jeder
# Anfrage. Wie das Smart System (`erstelle_android_client`): rustls mit den
# Wurzeln von Mozilla (`netz.rs`), rustls liegt über reqwest schon im Baum.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
webpki-roots = "1"

# Das Schild prüft jede Anfrage auf dem UI-Faden der WebView2. Ohne Optimierung
# brauchte die Engine dafür bis 57 ms je Anfrage, und `tauri dev` stand beim
# Laden einer Seite über eine Sekunde lang (10/2026). Abhängigkeiten werden
# deshalb auch im Entwicklungsbau optimiert.
[profile.dev.package."*"]
opt-level = 3
