use_default_settings: true
general:
  debug: false
  instance_name: "MSM Search Sidecar"
server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: ""
  limiter: false
  image_proxy: false
search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json
  # Die Kategorien-Tabs von Maunting Search (Web, Bilder, Videos, News) laufen
  # über `categories`; ohne diese Freigabe wirft SearXNG die Anfrage aus.
  default_categories:
    - general
    - images
    - videos
    - news
