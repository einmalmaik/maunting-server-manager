use_default_settings: true
general:
  debug: false
  instance_name: "MSM Search Sidecar"
search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "de"
  # POST statt GET: der Suchbegriff steht dann in keinem Zugriffslog.
  method: "POST"
  max_page: 20
  ban_time_on_fail: 5
  max_ban_time_on_fail: 60
  formats:
    - html
    - json
outgoing:
  request_timeout: 3.5
  max_request_timeout: 6.0
  retries: 1
server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: ""
  limiter: false
  image_proxy: false

# Datenschutz- und Direktantwort-Plugins:
# - tracker_url_remover bereinigt utm_*, fbclid, gclid usw. vor Auslieferung.
# - unit_converter, calculator und hash_plugin liefern Direktantworten (answers)
#   für Einheiten, Rechenausdrücke und Prüfsummen.
enabled_plugins:
  - 'Tracker URL remover'
  - 'Unit converter plugin'
  - 'Basic Calculator'
  - 'Hash plugin'
  - 'Open Access DOI rewrite'
  - 'Self Informations'

# Gezielte Engine-Gewichtung und Kategorien für Maunting Search (Web, Bilder,
# Videos, News). Starke, zuverlässige Quellen erhalten höheres Gewicht (`weight`),
# damit Trefferqualität und Antwortzeit hoch bleiben.
engines:
