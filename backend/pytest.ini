[pytest]
# Parallel und mit Zeitgrenze — beides aus einem gemessenen Anlass.
#
# `-n auto --dist loadfile`
#   Die Suite lief sequenziell ueber zehn Minuten. Auf acht Prozessen sind es
#   gut drei. `loadfile` haelt alle Tests einer Datei in einem Prozess: die
#   Fixtures bauen den Zustand je Datei auf, und eine Verteilung je Einzeltest
#   wuerde diesen Zusammenhang zerreissen.
#
# `--timeout=120`
#   Der eigentliche Grund, warum "die Tests ewig dauern" so schwer zu fassen
#   war: ein Test lief nicht lange, er lief **nie zu Ende**. Ein Provider-Mock
#   meldete in jeder Runde denselben Werkzeugaufruf, und die Stream-Schleife
#   drehte endlos. Ohne Zeitgrenze sieht das aus wie eine langsame Suite und
#   nicht wie ein Fehler.
#
#   Der langsamste echte Test liegt bei rund drei Sekunden. 120 ist damit weit
#   genug weg, um auf einem ausgelasteten CI-Rechner nicht falsch anzuschlagen,
#   und nah genug, um einen Stillstand als das zu melden, was er ist.
# `-m "not live"`
#   Das zweite Schloss vor den bezahlten Laeufen gegen einen echten
#   Modellanbieter. Das erste ist der Schluessel aus der Umgebung, und der
#   allein reichte nicht: eine Benchmarkdatei las beim Import selbst eine
#   Schluesseldatei aus dem Heimatverzeichnis ein und startete damit bei einem
#   schlichten `python -m pytest` bezahlte Anfragen. Ob Geld ausgegeben wird,
#   darf nicht davon abhaengen, welche Dateien auf dem Rechner liegen. Wer
#   bewusst messen will, haengt `-m live` an oder nimmt ohnehin
#   `-o addopts=""`, wie es in den Benchmarkdateien steht.
addopts = -n auto --dist loadfile --timeout=120 -m "not live"

markers =
    live: laeuft gegen einen echten Modellanbieter, kostet Tokens und braucht Netz; standardmaessig abgewaehlt (siehe addopts).
