<!DOCTYPE html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#071013" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MSM" />
    <meta name="application-name" content="Maunting Service Manager" />
    <meta name="description" content="Self-hosted game server and application management panel." />
    
    <!-- Prevent FOUC -->
    <style>
      body { 
        background-color: #071013;
        color: #e7f4f7;
        font-family: 'Inter', system-ui, sans-serif;
        margin: 0;
        padding: 0;
      }
      #root { 
        min-height: 100vh; 
      }
    </style>
    
    <title>Maunting Service Manager</title>

    <!--
      Keine Schriften von Dritten. Inter, Manrope, IBM Plex Sans und JetBrains
      Mono kommen aus src/main.tsx (@fontsource) und damit aus dem eigenen
      Build. Hier standen bis dahin drei Zeilen, die sie zur Laufzeit bei
      Google holten; die Begründung für den Wechsel steht in src/main.tsx.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
