name: Release deployment artifacts

# Baut alle Deployment-Artefakte für einen Release (Panel, Frontend, Agent),
# Smart System (MSS) und Secure Browser (MSB, `browser-build.yml`) für Windows
# und Android und veröffentlicht alle Dateien gemeinsam in einem einzigen
# GitHub-Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version label (z. B. v4.0.0)"
        required: false
      vite_api_url:
        description: "Optional public API URL for a separately hosted frontend"
        required: false
      vite_ws_url:
        description: "Optional public WebSocket URL for a separately hosted frontend"
        required: false

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-artifacts:
    name: Build Linux deployment units
    runs-on: ubuntu-latest
    # Die Backend-Suite laeuft nur auf PostgreSQL (wie in ci.yml).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            msm-agent/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            dis-sidecar/package-lock.json

      - name: Prepare /opt/msm runtime directories
        run: |
          sudo mkdir -p /opt/msm/servers /opt/msm/backups
          sudo chown -R "$USER":"$USER" /opt/msm

      - name: Test backend
        working-directory: backend
        env:
          MSM_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f dev-requirements.txt ]; then
            pip install -r dev-requirements.txt
          fi
          pip install pytest 2>/dev/null || true
          python -m pytest -q

      - name: Test agent
        working-directory: msm-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest 2>/dev/null || true
          python -m pytest tests -q

      - name: Build and test frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ inputs.vite_api_url }}
          VITE_WS_URL: ${{ inputs.vite_ws_url }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Test DIS sidecar
        working-directory: dis-sidecar
        run: |
          npm ci
          node --test test-backup-endpoints.mjs test-encrypt-envelope.mjs test-totp-step.mjs

      - name: Resolve artifact version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="manual-${GITHUB_SHA::12}"
          fi
          [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Package panel, frontend and agent
        run: bash scripts/build-release-artifacts.sh "${{ steps.version.outputs.value }}" release

      - name: Verify checksums and archive contents
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          tar -tzf "msm-panel-${{ steps.version.outputs.value }}.tar.gz" | grep -q '/backend/main.py$'
          tar -tzf "msm-panel-${{ steps.version.outputs.value }}.tar.gz" | grep -q '/livekit-sidecar/docker-compose.yml$'
          tar -tzf "msm-panel-${{ steps.version.outputs.value }}.tar.gz" | grep -q '/searxng-sidecar/docker-compose.yml$'
          tar -tzf "msm-panel-${{ steps.version.outputs.value }}.tar.gz" | grep -q '/wetter-sidecar/docker-compose.yml$'
          tar -tzf "msm-frontend-${{ steps.version.outputs.value }}.tar.gz" | grep -q '/dist/index.html$'
          tar -tzf "msm-agent-${{ steps.version.outputs.value }}.tar.gz" | grep -q '/msm-agent/main.py$'

      - uses: actions/upload-artifact@v4
        with:
          name: msm-deployment-units
          path: |
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows-desktop:
    name: Build Smart System (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            smart-system/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-system/src-tauri

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        working-directory: smart-system
        run: npm ci

      - name: TypeCheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Rust tests
        working-directory: smart-system/src-tauri
        run: cargo test

      - name: Resolve artifact version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            RAW_TAG="${INPUT_VERSION}"
          else
            RAW_TAG="v4.0.0"
          fi
          TAG="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${TAG}" >> "$GITHUB_OUTPUT"

          # Version in tauri.conf.json und Cargo.toml angleichen (nur [package], keine Dependencies!)
          python scripts/sync-tauri-version.py "${TAG}"

      - name: Set up .NET (for Velopack CLI)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      # Velopack ist der einzige Windows-Installer und -Updater: Tauri baut nur
      # die App (`bundle.targets: ["app"]`), kein NSIS-Paket und keine
      # Update-Signatur. Ein zweiter Installer installierte eine Fassung, die
      # Velopacks UpdateManager nicht kennt.
      - name: Build Tauri app
        working-directory: smart-system
        run: npx tauri build

      - name: Stage app for Velopack
        run: |
          mkdir -p velopack-stage-mss
          cp smart-system/src-tauri/target/release/MauntingSmartSystem.exe velopack-stage-mss/

      - name: Download Previous Velopack Releases (for Delta Updates)
        # Windows-Runner starten PowerShell; diese Funktionen der Schale ([[ ]],
        # $( ), sed) gibt es dort nicht. Der Schritt braucht bash.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          feed_asset="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '[.[] | select(.draft == false) | .assets[] | select(.name == "releases.mss.json")] | last | .url // empty')"
          if [[ -n "$feed_asset" ]]; then
            feed_version="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '[.[] | select(.draft == false) | select(any(.assets[]; .name == "releases.mss.json"))] | last | .tag_name // empty' | sed 's/^v//')"
            [[ -n "$feed_version" ]] || { echo "Version des MSS-Feeds fehlt." >&2; exit 1; }
            # Ein zweiter Lauf fuer denselben Tag findet das eigene Paket als
            # "vorheriges"; vpk pack bricht dann mit "exists" ab (20.10.2026).
            if [[ "$feed_version" != "${{ steps.version.outputs.clean_version }}" ]]; then
              mkdir -p smart-system-velopack
              gh api "$feed_asset" -H 'Accept: application/octet-stream' > smart-system-velopack/releases.mss.json
              feed_sig_asset="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '[.[] | select(.draft == false) | .assets[] | select(.name == "releases.mss.json.sig")] | last | .url // empty')"
              [[ -n "$feed_sig_asset" ]] || { echo "Vorhandene MSS-Feed-Signatur fehlt." >&2; exit 1; }
              gh api "$feed_sig_asset" -H 'Accept: application/octet-stream' > smart-system-velopack/releases.mss.json.sig
              vpk download github --repoUrl "https://github.com/einmalmaik/maunting-server-manager" --outputDir "smart-system-velopack" --channel "mss" --release "$feed_version"
            else
              echo "Der MSS-Feed im Release ist bereits diese Version; das Paket wird ohne Delta gebaut."
            fi
          else
            echo "Kein vorheriger MSS-Feed; das erste Paket wird als Vollpaket erstellt."
          fi

      - name: Package with Velopack
        run: |
          mkdir -p smart-system-velopack
          vpk pack --packId "MauntingSmartSystem" --packVersion "${{ steps.version.outputs.clean_version }}" --packDir "velopack-stage-mss" --mainExe "MauntingSmartSystem.exe" --icon "smart-system/src-tauri/icons/icon.ico" --splashImage "smart-system/src-tauri/installer/sidebar_hidpi_preview.png" --splashProgressColor "None" --channel "mss" --outputDir "smart-system-velopack"

      - name: Sign Velopack feed and Setup.exe for legacy v5.5.1 migration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `npx --prefix <dir>` sucht keine lokale Ausfuehrbare und brach mit
        # "could not determine executable to run" ab; der CLI-Einstiegspunkt
        # des eigenen `npm ci` wird deshalb direkt mit node gestartet.
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          cli="smart-system/node_modules/@tauri-apps/cli/tauri.js"
          node "$cli" signer sign --app-version "${{ steps.version.outputs.clean_version }}" smart-system-velopack/releases.mss.json
          for setup in smart-system-velopack/*-Setup.exe; do
            node "$cli" signer sign --app-version "${{ steps.version.outputs.clean_version }}" "$setup"
          done

      - name: Collect Velopack installer and Android version manifest
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python scripts/collect-desktop-artifacts.py "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: msm-desktop-windows
          path: |
            desktop-release/*
          if-no-files-found: error
          retention-days: 7

  build-android-apk:
    name: Build Smart System (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Standard ist "tools platform-tools". Das alte Paket `tools` fuehrt
          # der sdkmanager im Runner-Image (cmdline-tools 16.0) nicht mehr, und
          # die Einrichtung brach damit ab (v5.0.0, 29.09.2026).
          packages: platform-tools

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            smart-system/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        working-directory: smart-system
        run: npm ci

      - name: Resolve artifact version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            RAW_TAG="${INPUT_VERSION}"
          else
            RAW_TAG="v4.0.0"
          fi
          TAG="${RAW_TAG#v}"
          # Version in tauri.conf.json und Cargo.toml angleichen (nur [package], keine Dependencies!)
          python scripts/sync-tauri-version.py "${TAG}"

      - name: Build Android APK
        working-directory: smart-system
        run: |
          chmod +x src-tauri/gen/android/gradlew || true
          npx tauri android build --apk --target aarch64 --target armv7 --target i686 --target x86_64

      # Gradle baut unsigniert; der Schluessel liegt nur in den Secrets.
      # Fehlt ein Secret, bricht das Skript ab, statt ein unsigniertes APK
      # zu veroeffentlichen.
      - name: Sign Android APKs
        shell: bash
        env:
          MSS_ANDROID_ALT_KEYSTORE_B64: ${{ secrets.MSS_ANDROID_ALT_KEYSTORE_B64 }}
          MSS_ANDROID_ALT_KEYSTORE_PASSWORT: ${{ secrets.MSS_ANDROID_ALT_KEYSTORE_PASSWORT }}
          MSS_ANDROID_KEYSTORE_B64: ${{ secrets.MSS_ANDROID_KEYSTORE_B64 }}
          MSS_ANDROID_KEYSTORE_PASSWORT: ${{ secrets.MSS_ANDROID_KEYSTORE_PASSWORT }}
        run: |
          mapfile -t roh < <(find smart-system/src-tauri/gen/android/app/build/outputs/apk -type f -name "*-release-unsigned.apk")
          [ "${#roh[@]}" -gt 0 ] || { echo "Keine unsignierten Release-APKs gefunden." >&2; exit 1; }
          bash scripts/android-apk-signieren.sh "${roh[@]}"

      - name: Collect Android APK
        shell: bash
        run: |
          mkdir -p android-release
          APK_FILE=$(find smart-system/src-tauri/gen/android/app/build/outputs/apk -type f -name "*universal-release.apk" -o -name "*universal-universal*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find smart-system/src-tauri/gen/android/app/build/outputs/apk -type f -name "*arm64*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find smart-system/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" ! -name "*x86*" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "Kein signiertes APK gefunden." >&2
            exit 1
          fi
          echo "Packaging selected APK for MauntingSmartSystem.apk: $APK_FILE"
          cp -v "$APK_FILE" android-release/MauntingSmartSystem.apk
          for f in $(find smart-system/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk"); do
            cp -v "$f" "android-release/$(basename "$f")" || true
          done
          ls -la android-release/

      - uses: actions/upload-artifact@v4
        with:
          name: msm-mobile-android
          path: |
            android-release/*.apk
          if-no-files-found: warn
          retention-days: 7

  build-browser:
    name: Secure Browser
    uses: ./.github/workflows/browser-build.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  publish-release:
    name: Publish unified GitHub release
    needs: [build-linux-artifacts, build-windows-desktop, build-android-apk, build-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: msm-deployment-units
          path: final-release

      - uses: actions/download-artifact@v4
        with:
          name: msm-desktop-windows
          path: final-release

      - uses: actions/download-artifact@v4
        with:
          name: msm-mobile-android
          path: final-release

      - uses: actions/download-artifact@v4
        with:
          name: msb-windows
          path: final-release

      - uses: actions/download-artifact@v4
        with:
          name: msb-android
          path: final-release

      - name: Generate unified SHA256SUMS
        working-directory: final-release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attach assets to GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Titel, Notes und Veroeffentlichung setzt immer dieser Schritt, auch
        # wenn das Release schon da ist: `recovery-release.yml` ist meist
        # zuerst fertig und legt es als Entwurf „MSM Backup Recovery …“ ohne
        # Notes an. Bis 5.0.1 blieb es so stehen und musste von Hand
        # veroeffentlicht werden.
        run: |
          notes=""
          for kandidat in "docs/patchnotes/${TAG}-release-notes.md" "docs/patchnotes/${TAG}-hotfix-notes.md"; do
            if [ -f "$kandidat" ]; then notes="$kandidat"; break; fi
          done
          title="MSM / MSS / MSB $TAG"
          if [ -n "$notes" ]; then
            # "# Hotfix v5.0.1 — Thema" wird zu "MSM / MSS v5.0.1 — Hotfix: Thema".
            kopf=$(head -n1 "$notes")
            thema="${kopf#*— }"
            if [ "$thema" != "$kopf" ]; then
              case "$kopf" in "# Hotfix"*) thema="Hotfix: $thema" ;; esac
              title="$title — $thema"
            fi
          else
            notes="$RUNNER_TEMP/release-notes.md"
            echo "Einheitlicher Release: Panel, Frontend, Node-Agent, Maunting Smart System und Maunting Secure Browser für Windows und Android." > "$notes"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$title" --notes-file "$notes"
          fi
          gh release upload "$TAG" final-release/* --clobber
          latest=true
          case "$TAG" in *-*) latest=false ;; esac
          gh release edit "$TAG" --title "$title" --notes-file "$notes" --draft=false --latest="$latest"
          gh release view "$TAG" --json isDraft,name,assets --jq '"\(.name) | Entwurf: \(.isDraft) | \(.assets | length) Dateien"'

      # Ein Release gilt erst, wenn jede Datei daliegt, die ein Updater oder
      # die Doku nennt (AGENTS.md, Punkt 11). Bis 5.2.0 zaehlte dieser Schritt
      # nur die Dateien, und ein fehlendes APK fiel nicht auf.
      - name: Verify release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          vorhanden="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          fehlt=0
          # Windows-Updates laufen über Velopack: Installer, signierter Feed
          # und Vollpaket. `latest.json`/`latest-msb.json` dienen sowohl der
          # Android-Versionsprüfung als auch der automatischen Migration
          # bestehender v5.5.1-Installationen auf den Velopack-Installer.
          pflicht=(
            "msm-panel-$TAG.tar.gz" "msm-frontend-$TAG.tar.gz" "msm-agent-$TAG.tar.gz" SHA256SUMS
            MauntingSmartSystem-Setup.exe MauntingSmartSystem-Setup.exe.sig latest.json MauntingSmartSystem.apk
            releases.mss.json releases.mss.json.sig
            MauntingPontis-Setup.exe MauntingPontis-Setup.exe.sig latest-msb.json MauntingSecureBrowser.apk
            releases.pontis.json releases.pontis.json.sig
          )
          for datei in "${pflicht[@]}"; do
            grep -qxF "$datei" <<<"$vorhanden" || { echo "Fehlt im Release: $datei" >&2; fehlt=1; }
          done
          # vpk 1.2 legt den Kanal in den Paketnamen
          # (`Pontis-5.6.0-pontis-full.nupkg`); aeltere Fassungen ohne Kanal.
          for app in MauntingSmartSystem Pontis; do
            grep -qE "^${app}-${TAG#v}(-[a-z0-9]+)?-full\.nupkg$" <<<"$vorhanden" \
              || { echo "Fehlt im Release: ${app}-${TAG#v}[-<kanal>]-full.nupkg" >&2; fehlt=1; }
          done
          exit "$fehlt"
