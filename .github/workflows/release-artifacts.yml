name: Release deployment artifacts

# Baut alle Deployment-Artefakte für einen Release (Panel, Frontend, Agent)
# sowie den Windows-Desktop-Installer (MSS) und veröffentlicht alle Dateien
# gemeinsam in einem einzigen GitHub-Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version label (z. B. v4.0.0)"
        required: false
      vite_api_url:
        description: "Optional public API URL for a separately hosted frontend"
        required: false
      vite_ws_url:
        description: "Optional public WebSocket URL for a separately hosted frontend"
        required: false

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-artifacts:
    name: Build Linux deployment units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            msm-agent/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            dis-sidecar/package-lock.json

      - name: Prepare /opt/msm runtime directories
        run: |
          sudo mkdir -p /opt/msm/servers /opt/msm/backups
          sudo chown -R "$USER":"$USER" /opt/msm

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f dev-requirements.txt ]; then
            pip install -r dev-requirements.txt
          fi
          pip install pytest 2>/dev/null || true
          python -m pytest -q

      - name: Test agent
        working-directory: msm-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest 2>/dev/null || true
          python -m pytest tests -q

      - name: Build and test frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ inputs.vite_api_url }}
          VITE_WS_URL: ${{ inputs.vite_ws_url }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Test DIS sidecar
        working-directory: dis-sidecar
        run: |
          npm ci
          node --test test-backup-endpoints.mjs

      - name: Resolve artifact version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="manual-${GITHUB_SHA::12}"
          fi
          [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Package panel, frontend and agent
        run: bash scripts/build-release-artifacts.sh "${{ steps.version.outputs.value }}" release

      - name: Verify checksums and archive contents
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          tar -tzf "msm-panel-${{ steps.version.outputs.value }}.tar.gz" | grep -q '/backend/main.py$'
          tar -tzf "msm-frontend-${{ steps.version.outputs.value }}.tar.gz" | grep -q '/dist/index.html$'
          tar -tzf "msm-agent-${{ steps.version.outputs.value }}.tar.gz" | grep -q '/msm-agent/main.py$'

      - uses: actions/upload-artifact@v4
        with:
          name: msm-deployment-units
          path: |
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows-desktop:
    name: Build Smart System (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            smart-system/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-system/src-tauri

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        working-directory: smart-system
        run: npm ci

      - name: TypeCheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Rust tests
        working-directory: smart-system/src-tauri
        run: cargo test

      - name: Resolve artifact version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            RAW_TAG="${INPUT_VERSION}"
          else
            RAW_TAG="v4.0.0"
          fi
          TAG="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${TAG}" >> "$GITHUB_OUTPUT"

          # Version in tauri.conf.json und Cargo.toml angleichen
          node -e "
            const fs = require('fs');
            const confPath = 'smart-system/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = '${TAG}';
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2));
          "
          sed -i 's/^version = ".*"/version = "'${TAG}'"/' smart-system/src-tauri/Cargo.toml

      - name: Build Tauri app
        working-directory: smart-system
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Collect Windows installer and generate latest.json
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p desktop-release
          cp smart-system/src-tauri/target/release/bundle/nsis/*.exe desktop-release/MauntingSmartSystem-Setup.exe || true
          cp smart-system/src-tauri/target/release/MauntingSmartSystem.exe desktop-release/MauntingSmartSystem.exe || true

          # Updater-Dateien einsammeln (.nsis.zip, .zip, .sig)
          for f in $(find smart-system/src-tauri/target/release/bundle -type f \( -name "*.nsis.zip" -o -name "*.sig" \)); do
            cp -v "$f" desktop-release/ || true
          done

          # Prüfen, ob Tauri bereits ein latest.json generiert hat
          TAURI_LATEST=$(find smart-system/src-tauri/target/release/bundle -type f -name "latest.json" | head -n 1)
          if [ -n "$TAURI_LATEST" ]; then
            cp -v "$TAURI_LATEST" desktop-release/latest.json
          else
            # Erzeuge Tauri-v2 kompatibles latest.json mit Signatur
            SIG_FILE=$(find desktop-release -type f -name "*.sig" | head -n 1)
            ZIP_FILE=$(find desktop-release -type f -name "*.nsis.zip" | head -n 1)
            if [ -n "$SIG_FILE" ] && [ -n "$ZIP_FILE" ]; then
              SIGNATURE=$(cat "$SIG_FILE")
              ZIP_NAME=$(basename "$ZIP_FILE")
              PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              cat <<EOF > desktop-release/latest.json
{
  "version": "${TAG}",
  "notes": "MSS Update ${TAG}",
  "pub_date": "${PUB_DATE}",
  "platforms": {
    "windows-x86_64": {
      "signature": "${SIGNATURE}",
      "url": "https://github.com/einmalmaik/maunting-server-manager/releases/download/${TAG}/${ZIP_NAME}"
    }
  }
}
EOF
            fi
          fi

          if [ -f desktop-release/latest.json ]; then
            echo "--- latest.json erfolgreich bereitgestellt: ---"
            cat desktop-release/latest.json
          fi
          ls -la desktop-release/

      - uses: actions/upload-artifact@v4
        with:
          name: msm-desktop-windows
          path: |
            desktop-release/*
          if-no-files-found: error
          retention-days: 7

  build-android-apk:
    name: Build Smart System (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            smart-system/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Resolve artifact version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            RAW_TAG="${INPUT_VERSION}"
          else
            RAW_TAG="v4.0.0"
          fi
          TAG="${RAW_TAG#v}"
          node -e "
            const fs = require('fs');
            const confPath = 'smart-system/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = '${TAG}';
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2));
          "
          sed -i 's/^version = ".*"/version = "'${TAG}'"/' smart-system/src-tauri/Cargo.toml

      - name: Build Android APK
        working-directory: smart-system
        run: |
          chmod +x src-tauri/gen/android/gradlew || true
          npx tauri android build --apk --target aarch64 --target armv7 --target i686 --target x86_64

      - name: Collect Android APK
        shell: bash
        run: |
          mkdir -p android-release
          APK_FILE=$(find smart-system/src-tauri/gen/android/app/build/outputs/apk -type f -name "*universal*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find smart-system/src-tauri/gen/android/app/build/outputs/apk -type f -name "*arm64*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find smart-system/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            cp -v "$APK_FILE" android-release/MauntingSmartSystem.apk
          fi
          for f in $(find smart-system/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk"); do
            cp -v "$f" "android-release/$(basename "$f")" || true
          done
          ls -la android-release/

      - uses: actions/upload-artifact@v4
        with:
          name: msm-mobile-android
          path: |
            android-release/*.apk
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish unified GitHub release
    needs: [build-linux-artifacts, build-windows-desktop, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: msm-deployment-units
          path: final-release

      - uses: actions/download-artifact@v4
        with:
          name: msm-desktop-windows
          path: final-release

      - uses: actions/download-artifact@v4
        with:
          name: msm-mobile-android
          path: final-release
        continue-on-error: true

      - name: Generate unified SHA256SUMS
        working-directory: final-release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attach assets to GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "MSM $TAG" \
              --notes "Einheitlicher Release: Panel, Frontend, Node-Agent sowie Maunting Smart System Desktop- (Windows) und Mobile-Installer (Android APK)."
          fi
          gh release upload "$TAG" final-release/* --clobber
