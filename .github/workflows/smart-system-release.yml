name: Smart System Release

# Baut den NSIS-Installer des Maunting Smart Systems (MSS) und haengt ihn an den
# GitHub-Release.
#
# **Eigenes Tag-Praefix, kein `v*`.** Auf `v*` liegen bereits zwei Workflows
# (release-artifacts, recovery-release), und jeder von ihnen legt ueber
# tauri-action bzw. gh einen Draft-Release zum selben Tag an. Ein dritter
# Nebenlaeufer waere ein Wettlauf um dieselbe Release-Kennung. Die
# Desktop-App hat ohnehin ihren eigenen Takt: sie folgt der Panel-Version
# nicht, und ein Panel-Update erzwingt keinen neuen Installer.
#
# Windows only: die App ist es auch. Ducking (WASAPI), Uebernahme (enigo,
# xcap) und der Tresor (Credential Manager) sind unter `cfg(windows)`
# gebaut, und ein Linux-Installer waere eine Huelle ohne Inhalt.

on:
  push:
    tags:
      - "smart-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. smart-v0.1.0)"
        required: false

permissions:
  contents: write

concurrency:
  group: smart-system-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Smart System (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Die Oberflaeche der App kommt aus frontend/ (Desktop-Bau,
      # vite.desktop.config.ts) — smart-system/ ist nur noch die Tauri-Huelle
      # mit der CLI. Deshalb zwei npm-Installationen und die Tests dort, wo
      # der Code liegt.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            smart-system/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-system/src-tauri

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        working-directory: smart-system
        run: npm ci

      - name: TypeCheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run vitest (Desktop-Belange)
        working-directory: frontend
        run: npx vitest run src/desktop src/api src/components/ai/voice --maxWorkers=3

      # Die Sandbox-Grenze und die Freigabe der Uebernahme haengen an diesen
      # Tests. Ein Installer, der sie nicht bestanden hat, soll nicht
      # entstehen — deshalb vor dem Bau und nicht daneben.
      - name: Run Rust tests
        working-directory: smart-system/src-tauri
        run: cargo test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: smart-system
          tagName: ${{ github.ref_name }}
          releaseName: "MSS — Maunting Smart System ${{ github.ref_name }}"
          releaseBody: |
            Desktop-Begleiter fuer das MSM-Panel: dieselbe Oberflaeche wie im
            Browser (Chat, Realtime-Modus, Guardian, Aufgaben), Wake-Word
            offline auf dem Rechner, Arbeit im freigegebenen Sandbox-Ordner.

            **Anmelden geht nur per Kopplung.** Im Panel unter Profil -> KI
            einen Code erzeugen und hier eintragen; einzutragen ist die
            Adresse der API, nicht die der Weboberflaeche.

            **Hinweis:** Der Installer ist nicht signiert. Windows SmartScreen
            meldet deshalb einen unbekannten Herausgeber — ueber "Weitere
            Informationen" laesst er sich trotzdem starten. Pruefe vorher die
            SHA256-Summe aus den Release-Notizen.
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      # Die Summe gehoert in den Release, nicht in eine Anleitung: ein
      # unsignierter Installer ist genau dann vertrauenswuerdig, wenn sich
      # nachrechnen laesst, dass er der gebaute ist.
      - name: SHA256-Summe des Installers
        shell: pwsh
        working-directory: smart-system
        run: |
          $exe = Get-ChildItem -Recurse -Filter *.exe `
            -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis |
            Select-Object -First 1
          if (-not $exe) { throw "Kein NSIS-Installer gefunden" }
          $summe = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Write-Host "$summe  $($exe.Name)"
          "$summe  $($exe.Name)" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: SHA256SUMS als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: smart-system-sha256
          path: smart-system/SHA256SUMS.txt
