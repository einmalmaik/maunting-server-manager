[package]
name = "schluesselfach"
version = "1.0.0"
description = "Refresh-Token und biometrische Schlüsselfächer für die Tauri-Apps von MauntingStudios (MSS, MSB)"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-biometric = "2"
